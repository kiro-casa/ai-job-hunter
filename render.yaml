databases:
  - name: ai-job-hunter-db
    databaseName: ai_job_hunter
    user: ai_job_hunter_user
    plan: free

services:
  - type: web
    name: ai-job-hunter-api
    env: php
    buildCommand: |
      cd backend
      composer install --no-dev --optimize-autoloader
      php artisan config:cache
      php artisan route:cache
      php artisan view:cache
      # Build React frontend
      cd ../frontend
      npm install
      npm run build
      # Copy built files to Laravel public folder
      cp -r dist/* ../backend/public/
    startCommand: |
      cd backend
      php artisan migrate --force
      php artisan serve --host=0.0.0.0 --port=$PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        fromService:
          name: ai-job-hunter-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: SANCTUM_STATEFUL_DOMAINS
        value: localhost,localhost:3000,localhost:5173,127.0.0.1,127.0.0.1:8000,::1
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromDatabase:
          name: ai-job-hunter-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: ai-job-hunter-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: ai-job-hunter-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: ai-job-hunter-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: ai-job-hunter-db
          property: password